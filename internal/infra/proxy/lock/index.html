<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>{{.Task}} · Boreas</title>
    <style>
      {{template "style.css"}}
    </style>
  </head>
  <body>
    <main class="lock {{.Mood}}">
      {{template "bora.svg"}}
      <header>
        <small>BOREAS</small>
        <h1>{{.Task}} is locked</h1>
        <p>Enter the password to open it for a day.</p>
      </header>
      <form method="post">
        <label for="password">Password</label>
        <div class="field">
          <input
            id="password"
            name="boreas_password"
            type="password"
            autocomplete="current-password"
            aria-describedby="message"
            required
            autofocus
          />
          <button class="show" type="button" aria-pressed="false" hidden>Show</button>
        </div>
        <button class="unlock" type="submit">Unlock</button>
        <p id="message" role="alert">{{.Message}}</p>
      </form>
    </main>
    <script>
      {{template "script.js"}}
    </script>
  </body>
</html>
