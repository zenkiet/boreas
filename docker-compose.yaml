services:
  boreas-db:
    image: postgres:18-alpine
    container_name: boreas-db
    networks:
      - boreas-net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # Postgres 18 images store data in a version-specific subdirectory, so the
    # mount belongs at /var/lib/postgresql rather than /var/lib/postgresql/data.
    volumes:
      - boreas-db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-boreas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-boreas}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  boreas:
    build: .
    container_name: boreas
    ports:
      - "8080:8080"
    networks:
      - boreas-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      BOREAS_DB_HOST: boreas-db
      BOREAS_DB_USER: ${POSTGRES_USER:-postgres}
      BOREAS_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BOREAS_DB_NAME: ${POSTGRES_DB:-boreas}
      # Required on first start; ignored once a user exists. Boreas refuses to
      # start with an empty database and no admin password.
      BOREAS_ADMIN_USERNAME: ${BOREAS_ADMIN_USERNAME:-admin}
      BOREAS_ADMIN_EMAIL: ${BOREAS_ADMIN_EMAIL:-admin@example.com}
      BOREAS_ADMIN_PASSWORD: ${BOREAS_ADMIN_PASSWORD:-LoveAngular123}
    depends_on:
      boreas-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  boreas-db-data:

networks:
  boreas-net:
    driver: bridge
