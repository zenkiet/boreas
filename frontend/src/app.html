<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			rel="stylesheet"
			href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..600&display=swap"
		/>
		<script>
			// Resolve the theme before first paint so a dark visitor never sees a white flash.
			(() => {
				const stored = localStorage.getItem('boreas-theme');
				const mode = stored === 'light' || stored === 'dark' ? stored : null;
				const dark = mode ? mode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
				document.documentElement.dataset.theme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
