<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta name="color-scheme" content="light dark" />
		<script>
			// Resolve the theme before first paint so a dark visitor never sees a white flash.
			try {
				const stored = localStorage.getItem('boreas-theme');
				if (stored === 'light' || stored === 'dark')
					document.querySelector('meta[name="color-scheme"]').content = stored;
			} catch {}
		</script>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<meta
			name="description"
			content="Every Boreas staging environment in one place: what each task runs, who is on it, and how its build and deploy are going."
		/>
		<link
			rel="preload"
			href="/api/v1/public/projects"
			as="fetch"
			crossorigin="anonymous"
			fetchpriority="high"
		/>
		<script src="/_boreas/support.js" async fetchpriority="low"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
