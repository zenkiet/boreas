openapi: 3.2.0
info:
  description: Per-task staging environments. Tasks belong to projects and are served
    at /{project}/{task}/. Proxied task traffic is public; this API is not.
  title: Boreas API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      description: The token is returned once and expires in 30 days.
      operationId: post-auth-login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      summary: Exchange credentials for a token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      operationId: post-auth-logout
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Revoke the current token
      tags:
      - auth
  /api/v1/auth/me:
    get:
      operationId: get-auth-me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Current user
      tags:
      - auth
  /api/v1/auth/tokens:
    get:
      description: Metadata only; tokens and hashes are never returned.
      operationId: get-auth-tokens
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/APITokensResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: List your API tokens
      tags:
      - auth
    post:
      description: The token is returned once. Validity must not exceed 90 days. Requires
        a login session, not another API token.
      operationId: post-auth-tokens
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPITokenRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPITokenResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Create an API token
      tags:
      - auth
  /api/v1/auth/tokens/{id}:
    delete:
      description: Requires a login session. Users revoke only their own tokens.
      operationId: delete-auth-tokens-id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Revoke one of your API tokens
      tags:
      - auth
  /api/v1/bora/conversations:
    delete:
      description: Hidden ones included; also stops their running turns.
      operationId: delete-bora-conversations
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Delete all your conversations
      tags:
      - bora
    get:
      description: Newest first, without messages; answering is true while a turn
        runs. A conversation is hidden while a project its answers read is out of
        your reach. To page, pass next as before.
      operationId: get-bora-conversations
      parameters:
      - in: query
        name: before
        schema:
          type: string
      - in: query
        name: limit
        schema:
          default: 50
          maximum: 200
          minimum: 1
          type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: List your conversations
      tags:
      - bora
    post:
      description: 'Answers a first question about `about`: every project, one project,
        a task, its latest build, an Activity event or a log line, from the projects
        the caller is a member of. The answer comes as Server-Sent Events, each an
        `event: <name>` with a JSON data line: conversation {id} first on a new conversation;
        step {text} before each tool call; say {text}, the line to read aloud, written
        as it is spoken, before the answer''s first delta, or just before done when
        the model wrote none; delta {text} as the answer is written; reset {} when
        the text so far, its say included, led into a tool call, so the client drops
        it; then done {message, title?} with the saved answer, title on a new conversation,
        error {status, kind, message}, or stopped {} after a stop. A dropped connection
        does not stop the turn, and a comment heartbeat fills idle time. Read it with
        fetch and a stream reader: EventSource cannot send the Authorization header.
        Before the stream begins, 403 answers an API token, task grants alone or no
        project, 404 a subject the caller cannot see, 409 a server without an assistant,
        and 429 a caller with 3 turns running or a server with 20. The conversation
        is saved with its first answer; until then only its stream and GET reach it.'
      operationId: post-bora-conversations
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartConversationRequest'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Ask Bora in a new conversation
      tags:
      - bora
  /api/v1/bora/conversations/{id}:
    delete:
      description: Also stops its running turn.
      operationId: delete-bora-conversations-id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Delete one of your conversations
      tags:
      - bora
    get:
      description: With every message; answering holds the question of a running turn.
      operationId: get-bora-conversations-id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Get one of your conversations
      tags:
      - bora
  /api/v1/bora/conversations/{id}/messages:
    post:
      description: 'Answers from the conversation''s last 12 messages and every ran
        line. The answer comes as Server-Sent Events, each an `event: <name>` with
        a JSON data line: conversation {id} first on a new conversation; step {text}
        before each tool call; say {text}, the line to read aloud, written as it is
        spoken, before the answer''s first delta, or just before done when the model
        wrote none; delta {text} as the answer is written; reset {} when the text
        so far, its say included, led into a tool call, so the client drops it; then
        done {message, title?} with the saved answer, title on a new conversation,
        error {status, kind, message}, or stopped {} after a stop. A dropped connection
        does not stop the turn, and a comment heartbeat fills idle time. Read it with
        fetch and a stream reader: EventSource cannot send the Authorization header.
        409 also while a turn runs in the conversation.'
      operationId: post-bora-conversations-id-messages
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskConversationRequest'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "429":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Too Many Requests
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Ask a follow-up question
      tags:
      - bora
  /api/v1/bora/conversations/{id}/messages/{index}/ran:
    post:
      description: line is the app's own result line for an action the user ran from
        the answer at index. An answer holds at most 10; 400 also for an index that
        is not an answer.
      operationId: post-bora-conversations-id-messages-index-ran
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - in: path
        name: index
        required: true
        schema:
          minimum: 0
          type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RanRequest'
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Record what ran from an answer
      tags:
      - bora
  /api/v1/bora/conversations/{id}/stop:
    post:
      description: Cancels the turn, which saves nothing. Also 204 when no turn runs.
      operationId: post-bora-conversations-id-stop
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Stop a running turn
      tags:
      - bora
  /api/v1/bora/conversations/{id}/stream:
    get:
      description: 'Replays the running turn of a conversation from its start, then
        follows it. The answer comes as Server-Sent Events, each an `event: <name>`
        with a JSON data line: conversation {id} first on a new conversation; step
        {text} before each tool call; say {text}, the line to read aloud, written
        as it is spoken, before the answer''s first delta, or just before done when
        the model wrote none; delta {text} as the answer is written; reset {} when
        the text so far, its say included, led into a tool call, so the client drops
        it; then done {message, title?} with the saved answer, title on a new conversation,
        error {status, kind, message}, or stopped {} after a stop. A dropped connection
        does not stop the turn, and a comment heartbeat fills idle time. Read it with
        fetch and a stream reader: EventSource cannot send the Authorization header.
        204 when no turn runs.'
      operationId: get-bora-conversations-id-stream
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Follow a running turn
      tags:
      - bora
  /api/v1/bora/conversations/search:
    post:
      description: The list, kept to conversations with a message holding every word
        of query as a prefix, whatever its accents, each with a snippet of the newest
        such message. The query travels in the body, so request logs never hold it.
      operationId: post-bora-conversations-search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchConversationsRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationsResponse'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Search your conversations
      tags:
      - bora
  /api/v1/bora/images:
    post:
      description: The body is the image itself, JPEG, PNG, WebP or GIF, at most 5
        MiB; send its id in a question's images. Only its uploader reads it, and the
        bucket keeps it at most as long as its lifecycle rule. 409 when the server
        has no assistant or no S3 bucket.
      operationId: post-bora-images
      requestBody:
        content:
          image/*:
            schema:
              type: string
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoraImageResponse'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Upload an image to ask about
      tags:
      - bora
  /api/v1/bora/images/{id}:
    get:
      description: 404 also once the bucket's lifecycle rule removed it.
      operationId: get-bora-images-id
      parameters:
      - in: path
        name: id
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          content:
            image/*:
              schema:
                type: string
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Get one of your images
      tags:
      - bora
  /api/v1/code/repositories:
    get:
      description: Repositories Sourcebot indexes whose name contains query, at most
        20, for a project's repositories. 409 when no Sourcebot is configured.
      operationId: get-code-repositories
      parameters:
      - in: query
        name: query
        schema:
          example: blogic
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepositoriesResponse'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
      summary: Search indexed code repositories
      tags:
      - projects
  /api/v1/events/stream:
    get:
      description: 'Server-Sent Events carrying {} once on connect and after any successful
        authenticated write outside Bora''s conversations, a deploy''s interim task
        states and each recorded notification, with nothing about what changed: refetch
        what you show, such as GET /api/v1/projects. Bursts arrive as one event, and
        a comment heartbeat fills idle time. Read it with fetch and a stream reader:
        EventSource cannot send the Authorization header.'
      operationId: get-events-stream
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                type: string
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        "500":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error
      security:
      - bearerAuth: []
