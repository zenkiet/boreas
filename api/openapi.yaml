components:
  schemas:
    APIToken:
      properties:
        created_at:
          format: date-time
          type: string
        id:
          $ref: '#/components/schemas/UUID'
        name:
          example: staging-deployer
          type: string
        revoked_at:
          format: date-time
          nullable: true
          type: string
        status:
          $ref: '#/components/schemas/APITokenStatus'
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
      required:
      - id
      - name
      - valid_from
      - valid_to
      - created_at
      - revoked_at
      - status
      type: object
    APITokenStatus:
      enum:
      - scheduled
      - active
      - expired
      - revoked
      type: string
    APITokensResponse:
      properties:
        api_tokens:
          items:
            $ref: '#/components/schemas/APIToken'
          nullable: true
          type: array
        total:
          type: integer
      required:
      - api_tokens
      - total
      type: object
    AddMemberRequest:
      properties:
        role:
          $ref: '#/components/schemas/ProjectRole'
        user_id:
          $ref: '#/components/schemas/UUID'
      required:
      - user_id
      type: object
    CreateAPITokenRequest:
      properties:
        name:
          example: staging-deployer
          type: string
        valid_from:
          format: date-time
          type: string
        valid_to:
          format: date-time
          type: string
      required:
      - name
      - valid_from
      - valid_to
      type: object
    CreateAPITokenResponse:
      properties:
        api_token:
          $ref: '#/components/schemas/APIToken'
        token:
          format: password
          type: string
      required:
      - token
      - api_token
      type: object
    CreateCredentialRequest:
      properties:
        name:
          example: ghcr
          type: string
        registry:
          $ref: '#/components/schemas/RegistryKind'
        token:
          format: password
          type: string
        username:
          type: string
      required:
      - name
      - registry
      - username
      - token
      type: object
    CreateProjectRequest:
      properties:
        default_env:
          additionalProperties:
            type: string
          type: object
        default_image:
          example: nginx:alpine
          type: string
        default_port:
          example: 80
          type: integer
        name:
          example: Demo
          type: string
        registry_credential_id:
          $ref: '#/components/schemas/UUID'
        slug:
