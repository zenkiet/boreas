commit-msg:
  commands:
    conventional-commit:
      run: sh scripts/validate-commit-msg.sh {1}

pre-commit:
  commands:
    format:
      glob: "*.go"
      run: golangci-lint fmt --diff {staged_files}

pre-push:
  parallel: true
  commands:
    lint:
      run: golangci-lint run ./...
    test:
      run: go test ./...
    openapi:
      run: make openapi-check
